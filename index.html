<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Gestion scolaire pro</title>
    <meta
      name="description"
      content="Application de gestion scolaire pour le 2nd cycle et le lycée : suivi des élèves, cartes scolaires, enseignants, matières, emploi du temps, notes, bulletins, paiements et présences."
    />
    <meta property="og:title" content="Gestion scolaire pro" />
    <meta
      property="og:description"
      content="Application de gestion scolaire pour le 2nd cycle et le lycée : suivi des élèves, cartes scolaires, enseignants, matières, emploi du temps, notes, bulletins, paiements et présences."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f3f5fa;
        --card: #fff;
        --ink: #161b3d;
        --mut: #5d6385;
        --pri: #1f2a6b;
        --acc: #e8a317;
        --ok: #1e7a55;
        --bad: #b3322a;
        --line: #d9ddec;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1128;
          --card: #171b3a;
          --ink: #edeffa;
          --mut: #9aa0c8;
          --pri: #4f5cd0;
          --acc: #f0b63a;
          --ok: #4cc38a;
          --bad: #f07a71;
          --line: #2a3060;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e1128;
        --card: #171b3a;
        --ink: #edeffa;
        --mut: #9aa0c8;
        --pri: #4f5cd0;
        --acc: #f0b63a;
        --ok: #4cc38a;
        --bad: #f07a71;
        --line: #2a3060;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.5 "Public Sans",
          system-ui,
          sans-serif;
      }
      h1,
      h2,
      h3 {
        font-family:
          "Bricolage Grotesque", "Public Sans", system-ui, sans-serif;
        margin: 0;
        line-height: 1.15;
      }
      .app {
        display: flex;
        align-items: stretch;
      }
      header {
        flex: 0 0 210px;
        background: var(--pri);
        color: #fff;
        padding: 20px 12px;
      }
      header h1 {
        font-size: 1.35rem;
        font-weight: 800;
      }
      header p {
        margin: 2px 0 18px;
        opacity: 0.8;
        font-size: 0.85rem;
      }
      nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
        position: sticky;
        top: 12px;
      }
      nav button {
        background: transparent;
        border: 0;
        border-left: 4px solid transparent;
        border-radius: 4px;
        color: #fff;
        opacity: 0.8;
        padding: 11px 12px;
        text-align: left;
        font:
          600 0.95rem "Public Sans",
          sans-serif;
        cursor: pointer;
      }
      nav button[aria-current="true"] {
        opacity: 1;
        background: rgba(255, 255, 255, 0.14);
        border-color: var(--acc);
      }
      @media (max-width: 700px) {
        .app {
          flex-direction: column;
        }
        header {
          flex: none;
          padding: 14px 12px 0;
        }
        nav {
          flex-direction: row;
          overflow-x: auto;
          position: static;
        }
        nav button {
          white-space: nowrap;
          border-left: 0;
          border-bottom: 3px solid transparent;
          border-radius: 0;
        }
        nav button[aria-current="true"] {
          background: transparent;
        }
      }
      nav button:focus-visible,
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--acc);
        outline-offset: 2px;
      }
      main {
        flex: 1;
        min-width: 0;
        max-width: 1280px;
        padding: 20px 20px 48px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: end;
        margin: 14px 0;
      }
      label {
        display: flex;
        flex-direction: column;
        font-size: 0.82rem;
        color: var(--mut);
        gap: 4px;
      }
      input,
      select {
        font: inherit;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 10px;
        min-height: 40px;
      }
      .btn {
        background: var(--pri);
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 9px 16px;
        font:
          600 0.95rem "Public Sans",
          sans-serif;
        cursor: pointer;
        min-height: 40px;
      }
      .btn.ghost {
        background: transparent;
        color: var(--bad);
        border: 1px solid var(--line);
        padding: 4px 10px;
        min-height: 32px;
        font-size: 0.85rem;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        margin: 16px 0 24px;
      }
      .stat {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
      }
      .stat b {
        display: block;
        font:
          800 2rem "Bricolage Grotesque",
          sans-serif;
      }
      .stat span {
        color: var(--mut);
        font-size: 0.88rem;
      }
      .stat.hi {
        border-left: 5px solid var(--acc);
      }
      .wrap {
        overflow-x: auto;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 480px;
      }
      th,
      td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }
      th {
        font-size: 0.85rem;
        color: var(--mut);
        font-weight: 600;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td input[type="number"] {
        width: 68px;
        padding: 6px;
      }
      .wrap td:first-child,
      .wrap th:first-child {
        position: sticky;
        left: 0;
        background: var(--card);
        z-index: 1;
      }
      .ok {
        color: var(--ok);
        font-weight: 600;
      }
      .bad {
        color: var(--bad);
        font-weight: 600;
      }
      .mut {
        color: var(--mut);
      }
      .big {
        font:
          800 2.4rem "Bricolage Grotesque",
          sans-serif;
      }
      h2 {
        font-size: 1.3rem;
        margin-top: 8px;
      }
      .pr,
      .pall {
        display: none;
      }
      .rcp {
        background: var(--card);
        border: 2px dashed var(--line);
        border-radius: 8px;
        padding: 16px;
        margin: 16px 0;
      }
      .rcp table {
        min-width: 0;
      }
      .rcp td {
        padding: 6px 8px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 12px;
      }
      .cs {
        border: 2px solid var(--pri);
        border-radius: 10px;
        padding: 10px;
        background: var(--card);
        break-inside: avoid;
        font-size: 0.85rem;
        line-height: 1.4;
      }
      .cs h4 {
        margin: 0 0 2px;
        text-align: center;
        font:
          800 0.95rem "Bricolage Grotesque",
          sans-serif;
        color: var(--pri);
      }
      .cs .ph {
        float: right;
        width: 72px;
        height: 90px;
        border: 1px dashed var(--mut);
        margin: 2px 0 4px 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--mut);
        font-size: 0.7rem;
      }
      .cs img.ph {
        border: 1px solid var(--mut);
        object-fit: cover;
        display: block;
      }
      @media print {
        :root:not([data-theme="light"]),
        :root[data-theme="dark"],
        :root {
          --bg: #fff;
          --card: #fff;
          --ink: #000;
          --mut: #444;
          --line: #999;
          --ok: #000;
          --bad: #000;
          color-scheme: light;
        }
        .app {
          display: block;
        }
        header,
        .row,
        h2 {
          display: none;
        }
        .pr {
          display: block;
        }
        .pr h3 {
          font-size: 1.4rem;
        }
        body.pa .one {
          display: none;
        }
        body.pa .pall {
          display: block;
        }
        .bl {
          page-break-after: always;
        }
        .bl:last-child {
          page-break-after: auto;
        }
        body.pc main > *:not(.rcp) {
          display: none;
        }
        body.pc .rcp {
          border: 0;
        }
        .stats {
          grid-template-columns: repeat(4, 1fr);
        }
        .cards {
          grid-template-columns: repeat(2, 1fr);
        }
        .cs {
          border-color: #000;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Gestion scolaire</h1>
        <p>2nd cycle (7e–9e année) et lycée (10e–12e année)</p>
        <nav id="nav"></nav>
      </header>
      <main id="main"></main>
    </div>
    <script>
      var CL = [
        "7e année",
        "8e année",
        "9e année",
        "10e année",
        "11e LL",
        "11e SES",
        "12e TLL",
        "12e TSECO",
      ];
      var MA = {
        Mathématiques: 4,
        Français: 4,
        "Physique-Chimie": 3,
        SVT: 2,
        "Histoire-Géo": 2,
        Anglais: 2,
        EPS: 1,
      };
      var MALL = {
          Français: 4,
          Philosophie: 3,
          Anglais: 3,
          "Histoire-Géo": 3,
          Mathématiques: 2,
          SVT: 1,
          EPS: 1,
        },
        MASES = {
          Mathématiques: 4,
          Économie: 4,
          "Histoire-Géo": 3,
          Français: 3,
          Anglais: 2,
          Philosophie: 2,
          EPS: 1,
        };
      var FR = { "7e année": 6000, "8e année": 8000, "9e année": 10000 };
      function MAof(c) {
        if (S.mc && S.mc[c]) return S.mc[c];
        return /LL$/.test(c) ? MALL : /(SES|SECO)$/.test(c) ? MASES : MA;
      }
      var TABS = [
        ["home", "Tableau de bord"],
        ["eleves", "Élèves"],
        ["cartes", "Cartes scolaires"],
        ["ens", "Enseignants"],
        ["mat", "Matières"],
        ["edt", "Emploi du temps"],
        ["notes", "Notes"],
        ["bulletin", "Bulletins"],
        ["res", "Admis et redoublants"],
        ["paie", "Paiements"],
        ["abs", "Absences"],
        ["adm", "Administration"],
      ];
      var tab = "home",
        ui = {
          cl: CL[0],
          mat: "Mathématiques",
          t: 1,
          el: "",
          date: new Date().toISOString().slice(0, 10),
          fcl: "",
          pcl: CL[0],
        };
      function seed() {
        var n = [
          ["Aminata Traoré", 0],
          ["Moussa Keïta", 0],
          ["Fatoumata Diarra", 1],
          ["Ibrahim Coulibaly", 2],
          ["Mariam Sangaré", 3],
          ["Seydou Konaté", 4],
          ["Awa Dembélé", 5],
          ["Oumar Sissoko", 5],
        ];
        return {
          eleves: n.map(function (x, i) {
            return { id: "e" + i, nom: x[0], cl: CL[x[1]] };
          }),
          notes: {},
          abs: {},
        };
      }
      var S;
      try {
        S = JSON.parse(localStorage.getItem("gs"));
      } catch (e) {}
      if (!S || !S.eleves) S = seed();
      S.paie = S.paie || [];
      S.ens = S.ens || [];
      S.dec = S.dec || {};
      S.notes = S.notes || {};
      Object.keys(S.notes).forEach(function (k) {
        if (k.split("|").length == 3) {
          S.notes[k + "|c"] = S.notes[k];
          delete S.notes[k];
        }
      });
      S.appel = S.appel || {};
      S.eleves.forEach(function (e) {
        if (e.cl == "11e année") e.cl = "11e LL";
        if (e.cl == "12e année") e.cl = "12e TLL";
      });
      function apiPost(url, data) {
        return fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        }).catch(function (e) {
          console.warn("SQL API write error:", e);
        });
      }
      function apiDelete(url) {
        return fetch(url, { method: "DELETE" }).catch(function (e) {
          console.warn("SQL API delete error:", e);
        });
      }
      function syncEdt(classe) {
        if (!S.edt || !S.edt[classe]) return;
        apiPost("/api/edt", {
          classe: classe,
          creneaux: S.edt[classe].sl,
          grille: S.edt[classe].c,
        });
      }
      function save() {
        try {
          localStorage.setItem("gs", JSON.stringify(S));
        } catch (e) {}
      }
      function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }
      function cyc(c) {
        return parseInt(c) <= 9 ? "2nd cycle" : "Lycée";
      }
      function opts(a, v) {
        return a
          .map(function (x) {
            return (
              "<option" + (x == v ? " selected" : "") + ">" + x + "</option>"
            );
          })
          .join("");
      }
      function moy(id, t) {
        var e = S.eleves.filter(function (x) {
            return x.id == id;
          })[0],
          M = MAof(e ? e.cl : CL[0]),
          s = 0,
          c = 0;
        for (var m in M) {
          var v = nm(id, m, t);
          if (v !== null) {
            s += v * M[m];
            c += M[m];
          }
        }
        return c ? s / c : null;
      }
      function f(x) {
        return x === null ? "–" : x.toFixed(2).replace(".", ",");
      }
      function mention(m) {
        return m === null
          ? ""
          : m >= 16
            ? "Très bien"
            : m >= 14
              ? "Bien"
              : m >= 12
                ? "Assez bien"
                : m >= 10
                  ? "Passable"
                  : "Insuffisant";
      }
      function cls(m) {
        return m === null ? "mut" : m >= 10 ? "ok" : "bad";
      }
      function inCl(c) {
        return S.eleves.filter(function (e) {
          return e.cl == c;
        });
      }
      function go(t) {
        tab = t;
        draw();
      }
      function draw() {
        document.getElementById("nav").innerHTML = TABS.map(function (t) {
          return (
            '<button aria-current="' +
            (t[0] == tab) +
            '" onclick="go(\'' +
            t[0] +
            "')\">" +
            t[1] +
            "</button>"
          );
        }).join("");
        document.getElementById("main").innerHTML = V[tab]();
      }
      var V = {
        home: function () {
          var n = S.eleves.length,
            c2 = S.eleves.filter(function (e) {
              return cyc(e.cl) == "2nd cycle";
            }).length;
          var ab = S.eleves.filter(function (e) {
            return S.abs[ui.date + "|" + e.id];
          }).length;
          var rows = CL.map(function (c) {
            var l = inCl(c),
              m = l
                .map(function (e) {
                  return moy(e.id, ui.t);
                })
                .filter(function (x) {
                  return x !== null;
                }),
              a = m.length
                ? m.reduce(function (x, y) {
                    return x + y;
                  }) / m.length
                : null;
            return (
              "<tr><td>" +
              c +
              '</td><td class="mut">' +
              cyc(c) +
              "</td><td>" +
              l.length +
              '</td><td class="' +
              cls(a) +
              '">' +
              f(a) +
              "</td></tr>"
            );
          }).join("");
          return (
            '<div class="stats"><div class="stat hi"><b>' +
            n +
            "</b><span>élèves inscrits</span></div><div class=stat><b>" +
            c2 +
            "</b><span>au 2nd cycle</span></div><div class=stat><b>" +
            (n - c2) +
            "</b><span>au lycée</span></div><div class=stat><b>" +
            S.ens.length +
            "</b><span>enseignants</span></div><div class=stat><b class=ok>" +
            S.eleves.filter(function (e) {
              return dec(e) == "Admis";
            }).length +
            "</b><span>admis</span></div><div class=stat><b class=bad>" +
            S.eleves.filter(function (e) {
              return dec(e) == "Redouble";
            }).length +
            "</b><span>redoublants</span></div></div>" +
            pres() +
            sxs() +
            '<div class=row><h2>Moyennes par classe</h2><label>Trimestre<select onchange="ui.t=+this.value;draw()">' +
            opts([1, 2, 3], ui.t) +
            "</select></label></div><div class=wrap><table><tr><th>Classe</th><th>Niveau</th><th>Effectif</th><th>Moyenne /20</th></tr>" +
            rows +
            "</table></div>"
          );
        },
        ens: function () {
          return (
            '<h2>Enseignants</h2><div class=row><label>Nom complet<input id=tn placeholder="Prénom Nom"></label><label>Matière<select id=tm>' +
            opts(
              [
                "Mathématiques",
                "Français",
                "Physique-Chimie",
                "SVT",
                "Histoire-Géo",
                "Anglais",
                "EPS",
                "Philosophie",
                "Économie",
              ],
              "",
            ) +
            '</select></label><label>Téléphone<input id=tt type=tel></label></div><div class=row><fieldset style="border:1px solid var(--line);border-radius:6px"><legend class=mut>Classes enseignées</legend>' +
            CL.map(function (c) {
              return (
                '<label style="flex-direction:row;align-items:center;display:inline-flex;margin:2px 10px 2px 0;color:var(--ink)"><input type=checkbox class=tc value="' +
                c +
                '" style="min-height:0"> ' +
                c +
                "</label>"
              );
            }).join("") +
            '</fieldset><button class=btn onclick="addT()">Ajouter l’enseignant</button></div>' +
            (S.ens.length
              ? "<div class=wrap><table><tr><th>Nom</th><th>Matière</th><th>Classes</th><th>Téléphone</th><th></th></tr>" +
                S.ens
                  .map(function (t) {
                    return (
                      "<tr><td>" +
                      esc(t.nom) +
                      "</td><td>" +
                      t.mat +
                      "</td><td class=mut>" +
                      (t.cl.join(", ") || "–") +
                      "</td><td>" +
                      esc(t.tel || "–") +
                      '</td><td><button class="btn ghost" onclick="delT(\'' +
                      t.id +
                      "')\">Retirer</button></td></tr>"
                    );
                  })
                  .join("") +
                "</table></div>"
              : "<p class=mut>Aucun enseignant enregistré.</p>")
          );
        },
        res: function () {
          var l = inCl(ui.cl),
            c = l.map(dec),
            ad = c.filter(function (x) {
              return x == "Admis";
            }).length,
            rd = c.filter(function (x) {
              return x == "Redouble";
            }).length;
          return (
            '<h2>Admis et redoublants</h2><div class=row><label>Classe<select onchange="ui.cl=this.value;draw()">' +
            opts(CL, ui.cl) +
            '</select></label></div><div class=stats><div class="stat hi"><b class=ok>' +
            ad +
            "</b><span>admis</span></div><div class=stat><b class=bad>" +
            rd +
            "</b><span>redoublants</span></div><div class=stat><b>" +
            (ad + rd ? Math.round((ad * 100) / (ad + rd)) + " %" : "–") +
            "</b><span>taux de réussite</span></div></div>" +
            (l.length
              ? "<div class=wrap><table><tr><th>Élève</th><th>T1</th><th>T2</th><th>T3</th><th>Moy. annuelle</th><th>Décision</th></tr>" +
                l
                  .map(function (e) {
                    var a = an(e),
                      au = a === null ? "–" : a >= 10 ? "Admis" : "Redouble";
                    return (
                      "<tr><td>" +
                      esc(e.nom) +
                      "</td>" +
                      [1, 2, 3]
                        .map(function (t) {
                          return "<td>" + f(moy(e.id, t)) + "</td>";
                        })
                        .join("") +
                      '<td class="' +
                      cls(a) +
                      '">' +
                      f(a) +
                      "</td><td><select onchange=\"setD('" +
                      e.id +
                      '\',this.value)" aria-label="Décision pour ' +
                      esc(e.nom) +
                      '"><option value="">Auto : ' +
                      au +
                      "</option><option" +
                      (S.dec[e.id] == "Admis" ? " selected" : "") +
                      ">Admis</option><option" +
                      (S.dec[e.id] == "Redouble" ? " selected" : "") +
                      ">Redouble</option></select></td></tr>"
                    );
                  })
                  .join("") +
                "</table></div><p class=mut>La décision automatique est « Admis » si la moyenne annuelle (moyenne des trimestres) est d’au moins 10/20. Vous pouvez la modifier élève par élève.</p>"
              : "<p class=mut>Aucun élève dans cette classe.</p>")
          );
        },
        adm: function () {
          var tc = S.paie.reduce(function (a, p) {
            return a + p.m;
          }, 0);
          return (
            '<h2>Administration</h2><div class=row><label>Nom de l’école<input value="' +
            esc(S.ecole || "") +
            '" onchange="setF(\'ecole\',this.value)"></label><label>Année scolaire<input value="' +
            esc(S.an || "") +

          save();
          apiPost("/api/absences", {
            date: ui.date,
            eleveId: id,
            type: S.abs[k].t || "A",
            motif: v,
          });
        }
      }
      function cnt(id) {
        var a = 0,
          r = 0;
        for (var k in S.abs)
          if (k.split("|")[1] == id) {
            if (S.abs[k].t == "R") r++;
            else a++;
          }
        return [a, r];
      }
      function syncWithDatabase(forceUser) {
        var msg = document.getElementById("sqlsyncmsg");
        if (msg) msg.textContent = "Synchronisation en cours avec la base SQL relationnelle...";
        fetch("/api/data")
          .then(function (res) {
            return res.json();
          })
          .then(function (resp) {
            if (resp && resp.ok && resp.data) {
              var d = resp.data;
              if (d.eleves && d.eleves.length > 0) {
                S = d;
                save();
                draw();
                if (msg)
                  msg.textContent =
                    "Données synchronisées avec succès depuis la base SQL.";
              } else {
                apiPost("/api/sync", S).then(function () {
                  if (msg)
                    msg.textContent =
                      "Données locales injectées et synchronisées dans la base SQL.";
                });
              }
            }
          })
          .catch(function (err) {
            if (msg)
              msg.textContent =
                "Erreur de communication avec la base SQL : " + err.message;
          });
      }

      function testMySqlConn() {
        var h = document.getElementById("myh").value.trim();
        var p = document.getElementById("myp").value.trim();
        var u = document.getElementById("myu").value.trim();
        var pw = document.getElementById("mypw").value;
        var db = document.getElementById("mydb").value.trim();
        var resEl = document.getElementById("mytestres");
        resEl.textContent = "Test de connexion MySQL en cours...";
        fetch("/api/database/test-mysql", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            host: h,
            port: p,
            user: u,
            password: pw,
            database: db,
          }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            if (data.ok) {
              resEl.className = "ok";
              resEl.textContent = "✅ " + data.message;
            } else {
              resEl.className = "bad";
              resEl.textContent =
                "❌ Échec de connexion : " +
                (data.error || "Serveur MySQL injoignable");
            }
          })
          .catch(function (err) {
            resEl.className = "bad";
            resEl.textContent = "❌ Erreur réseau : " + err.message;
          });
      }

      function initDatabaseSync() {
        fetch("/api/data")
          .then(function (res) {
            return res.json();
          })
          .then(function (resp) {
            if (resp && resp.ok && resp.data) {
              var d = resp.data;
              if (d.eleves && d.eleves.length > 0) {
                S = d;
                save();
                draw();
              } else if (S && S.eleves && S.eleves.length > 0) {
                apiPost("/api/sync", S);
              }
            }
          })
          .catch(function (err) {
            console.warn("Base SQL hors-ligne temporaire, mode local:", err);
          });
      }

      draw();
      initDatabaseSync();
    </script>
  </body>
